vars:
  - scrutins.yaml
  - zones.yaml
  - rne: "2026-05"
  - src: "src"
  - raw: "data/01_raw"
  - clean: "data/02_clean"
  - main: "data/03_main"
  - python: PYTHONPATH=src python -m

stages:
  nettoyer-2020-municipales-1:
    cmd: >-
      sed '13751,13752s/ \t / / ; 16921s/ \t / /'
      < ${raw}/ministere_interieur/2020-municipales-1-bureau_de_vote_avant_correction.csv
      > ${raw}/ministere_interieur/2020-municipales-1-bureau_de_vote.csv
    deps:
      - ${raw}/ministere_interieur/2020-municipales-1-bureau_de_vote_avant_correction.csv
    outs:
      - ${raw}/ministere_interieur/2020-municipales-1-bureau_de_vote.csv

  # Quatre bureaux de Montbéliard (série 0E) sortent du ministère sans code de bureau :
  # « Montbéliard;0 » au lieu de « Montbéliard;0E11 ». On rétablit le code, et RIEN
  # d'autre — la substitution ajoutait un « ; » de tête, qui décalait tous les champs de
  # la ligne d'un cran : « Code BV » recevait « Montbéliard », « Inscrits » recevait
  # « 0E11 » (lu comme 0e11, donc 0) et « Exprimés » un pourcentage, donc NA. Ces
  # 20 lignes sans exprimés faisaient ensuite échouer tout le scrutin en aval.
  nettoyer-2024-legislatives-1:
    cmd: >-
      sed '
      14169s/Montbéliard\;0/Montbéliard\;0E11/ ;
      14170s/Montbéliard\;0/Montbéliard\;0E21/ ;
      14171s/Montbéliard\;0/Montbéliard\;0E31/ ;
      14172s/Montbéliard\;0/Montbéliard\;0E41/ ; '
      < ${raw}/ministere_interieur/2024-legislatives-1-bureau_de_vote_avant_correction.csv
      > ${raw}/ministere_interieur/2024-legislatives-1-bureau_de_vote.csv
    deps:
      - ${raw}/ministere_interieur/2024-legislatives-1-bureau_de_vote_avant_correction.csv
    outs:
      - ${raw}/ministere_interieur/2024-legislatives-1-bureau_de_vote.csv

  normaliser-format-elections:
    foreach: ${scrutins}
    do:
      cmd: >-
        ${python} hexagonal.elections.resultats.format_${item.format}
        --source ${raw}/ministere_interieur/${key}.csv
        --output ${clean}/elections/${key}.parquet
        ${item.options}
      deps:
        - ${raw}/ministere_interieur/${key}.csv
        - ${src}/hexagonal/elections/resultats/format_${item.format}.py
        - ${src}/hexagonal/codes.py
      outs:
        - ${clean}/elections/${key}.parquet

  normaliser-format-senatoriales-2023:
    deps:
      - ${raw}/ministere_interieur/2023-senatoriales-departement.xlsx
      - ${raw}/ministere_interieur/2023-senatoriales-candidats.xlsx
      - ${src}/hexagonal/elections/senatoriales/nettoyer_2023.py
    outs:
      - ${clean}/elections/2023-senatoriales-departement.parquet
    cmd: >-
      ${python} hexagonal.elections.senatoriales.nettoyer_2023
      ${raw}/ministere_interieur/2023-senatoriales-departement.xlsx
      ${raw}/ministere_interieur/2023-senatoriales-candidats.xlsx
      ${clean}/elections/2023-senatoriales-departement.parquet

  normaliser-format-senatoriales-2020:
    deps:
      - ${raw}/ministere_interieur/2020-senatoriales-departement.xlsx
      - ${raw}/lafranceinsoumise/code_electoral/2003-senateurs-par-departements.csv
      - ${src}/hexagonal/elections/senatoriales/nettoyer_2020.py
    outs:
      - ${clean}/elections/2020-senatoriales-departement.parquet
    cmd: >-
      ${python} hexagonal.elections.senatoriales.nettoyer_2020
      ${raw}/ministere_interieur/2020-senatoriales-departement.xlsx
      ${raw}/lafranceinsoumise/code_electoral/2003-senateurs-par-departements.csv
      ${clean}/elections/2020-senatoriales-departement.parquet

  candidats-nettoyer-legislatives-2022-2024:
    foreach:
      2022-legislatives-1-candidats:
        delimiter: "\t"
        encoding: latin1
      2022-legislatives-2-candidats:
        delimiter: "\t"
        encoding: latin1
      2024-legislatives-1-candidats:
        delimiter: ";"
      2024-legislatives-2-candidats:
        delimiter: ";"
    do:
      cmd: >-
        ${python} hexagonal.elections.candidatures.nettoyer_legislatives_2022_2024
        ${item}
        "${raw}/ministere_interieur/${key}.csv"
        "${clean}/elections/${key}.csv"
      deps:
        - ${raw}/ministere_interieur/${key}.csv
        - ${src}/hexagonal/elections/candidatures/nettoyer_legislatives_2022_2024.py
      outs:
        - ${clean}/elections/${key}.csv

  2026-municipales-composition_listes_t2:
    deps:
      - ${clean}/elections/2026-municipales-1-candidats.parquet
      - ${clean}/elections/2026-municipales-2-candidats.parquet
      - ${clean}/elections/2026-municipales-1-bureau_de_vote.parquet
      - ${src}/hexagonal/elections/municipales2026/composition_listes_t2.py
    outs:
      - ${main}/elections/2026-municipales-2-composition-listes.parquet
      - ${main}/elections/2026-municipales-2-composition-listes-nominative.parquet
    cmd: >-
      ${python} hexagonal.elections.municipales2026.composition_listes_t2
      --code code_commune
      ${clean}/elections/2026-municipales-1-candidats.parquet
      ${clean}/elections/2026-municipales-2-candidats.parquet
      ${clean}/elections/2026-municipales-1-bureau_de_vote.parquet
      ${main}/elections/2026-municipales-2-composition-listes.parquet
      ${main}/elections/2026-municipales-2-composition-listes-nominative.parquet

  2026-municipales-elus:
    deps:
      - ${clean}/elections/2026-municipales-1-sieges.parquet
      - ${clean}/elections/2026-municipales-2-sieges.parquet
      - ${clean}/elections/2026-municipales-1-candidats.parquet
      - ${clean}/elections/2026-municipales-2-candidats.parquet
      - ${main}/elections/2026-municipales-2-composition-listes-nominative.parquet
      - ${src}/hexagonal/elections/municipales2026/elus.py
    outs:
      - ${main}/elections/2026-municipales-elus.parquet
    cmd:
      ${python} hexagonal.elections.municipales2026.elus
      municipales
      ${clean}/elections/2026-municipales-1-sieges.parquet
      ${clean}/elections/2026-municipales-2-sieges.parquet
      ${clean}/elections/2026-municipales-1-candidats.parquet
      ${clean}/elections/2026-municipales-2-candidats.parquet
      ${main}/elections/2026-municipales-2-composition-listes-nominative.parquet
      ${main}/elections/2026-municipales-elus.parquet

  2026-municipales-sieges:
    foreach:
      - 1
      - 2
    do:
      deps:
        - ${raw}/ministere_interieur/2026-municipales-${item}-commune.csv
        - ${src}/hexagonal/elections/municipales2026/sieges.py
      outs:
        - ${clean}/elections/2026-municipales-${item}-sieges.parquet
      cmd: >-
        ${python} hexagonal.elections.municipales2026.sieges
        municipales
        ${raw}/ministere_interieur/2026-municipales-${item}-commune.csv
        ${clean}/elections/2026-municipales-${item}-sieges.parquet

  2026-municipales-candidats:
    foreach:
      - 1
      - 2
    do:
      deps:
        - ${raw}/ministere_interieur/2026-municipales-${item}-candidats.csv
        - ${src}/hexagonal/elections/candidatures/municipales2026.py
      outs:
        - ${clean}/elections/2026-municipales-${item}-candidats.parquet
      cmd: >-
        ${python} hexagonal.elections.candidatures.municipales2026
        --code code_commune
        --communautaire
        ${raw}/ministere_interieur/2026-municipales-${item}-candidats.csv
        ${clean}/elections/2026-municipales-${item}-candidats.parquet

  2026-conseils-PLM-elus:
    deps:
      - ${clean}/elections/2026-conseils-PLM-1-sieges.parquet
      - ${clean}/elections/2026-conseils-PLM-2-sieges.parquet
      - ${clean}/elections/2026-conseils-PLM-1-candidats.parquet
      - ${clean}/elections/2026-conseils-PLM-2-candidats.parquet
      - ${main}/elections/2026-conseils-PLM-2-composition-listes-nominative.parquet
      - ${src}/hexagonal/elections/municipales2026/elus.py
    outs:
      - ${main}/elections/2026-conseils-PLM-elus.parquet
    cmd:
      ${python} hexagonal.elections.municipales2026.elus
      conseils-plm
      ${clean}/elections/2026-conseils-PLM-1-sieges.parquet
      ${clean}/elections/2026-conseils-PLM-2-sieges.parquet
      ${clean}/elections/2026-conseils-PLM-1-candidats.parquet
      ${clean}/elections/2026-conseils-PLM-2-candidats.parquet
      ${main}/elections/2026-conseils-PLM-2-composition-listes-nominative.parquet
      ${main}/elections/2026-conseils-PLM-elus.parquet

  2026-conseils-PLM-composition_listes_t2:
    deps:
      - ${clean}/elections/2026-conseils-PLM-1-candidats.parquet
      - ${clean}/elections/2026-conseils-PLM-2-candidats.parquet
      - ${clean}/elections/2026-conseils-PLM-1-bureau_de_vote.parquet
      - ${src}/hexagonal/elections/municipales2026/composition_listes_t2.py
    outs:
      - ${main}/elections/2026-conseils-PLM-2-composition-listes.parquet
      - ${main}/elections/2026-conseils-PLM-2-composition-listes-nominative.parquet
    cmd: >-
      ${python} hexagonal.elections.municipales2026.composition_listes_t2
      --code code_secteur
      ${clean}/elections/2026-conseils-PLM-1-candidats.parquet
      ${clean}/elections/2026-conseils-PLM-2-candidats.parquet
      ${clean}/elections/2026-conseils-PLM-1-bureau_de_vote.parquet
      ${main}/elections/2026-conseils-PLM-2-composition-listes.parquet
      ${main}/elections/2026-conseils-PLM-2-composition-listes-nominative.parquet

  2026-conseils-PLM-sieges:
    foreach:
      - 1
      - 2
    do:
      deps:
        - ${raw}/ministere_interieur/2026-conseils-PLM-${item}-secteur.csv
        - ${src}/hexagonal/elections/municipales2026/sieges.py
      outs:
        - ${clean}/elections/2026-conseils-PLM-${item}-sieges.parquet
      cmd: >-
        ${python} hexagonal.elections.municipales2026.sieges
        conseils-plm
        ${raw}/ministere_interieur/2026-conseils-PLM-${item}-secteur.csv
        ${clean}/elections/2026-conseils-PLM-${item}-sieges.parquet

  2026-conseils-PLM-candidats:
    foreach:
      - 1
      - 2
    do:
      deps:
        - ${raw}/ministere_interieur/2026-conseils-PLM-${item}-candidats.csv
        - ${src}/hexagonal/elections/candidatures/municipales2026.py
      outs:
        - ${clean}/elections/2026-conseils-PLM-${item}-candidats.parquet
      cmd: >-
        ${python} hexagonal.elections.candidatures.municipales2026
        --code code_secteur
        ${raw}/ministere_interieur/2026-conseils-PLM-${item}-candidats.csv
        ${clean}/elections/2026-conseils-PLM-${item}-candidats.parquet

  2024-legislatives-candidats:
    foreach:
      - 1
      - 2
    do:
      cmd: >-
        ${python} hexagonal.elections.candidatures.qualifier_legislatives2024
        ${clean}/elections/2024-legislatives-${item}-candidats.csv
        ${raw}/lafranceinsoumise/elections/2024-legislatives-nfp-sensibilites.csv
        ${raw}/lafranceinsoumise/elections/2024-legislatives-nuances.csv
        ${raw}/lafranceinsoumise/elections/2024-legislatives-candidats.csv
        ${main}/elections/2024-legislatives-${item}-candidats.csv
      deps:
        - ${clean}/elections/2024-legislatives-${item}-candidats.csv
        - ${raw}/lafranceinsoumise/elections/2024-legislatives-nfp-sensibilites.csv
        - ${raw}/lafranceinsoumise/elections/2024-legislatives-nuances.csv
        - ${raw}/lafranceinsoumise/elections/2024-legislatives-candidats.csv
        - ${src}/hexagonal/elections/candidatures/qualifier_legislatives2024.py
        - ${src}/hexagonal/codes.py
      outs:
        - ${main}/elections/2024-legislatives-${item}-candidats.csv

  2024-europeenne-candidats:
    deps:
      - ${raw}/ministere_interieur/2024-europeenne-candidats.csv
      - ${src}/hexagonal/elections/candidatures/europeenne2024.py
    outs:
      - ${clean}/elections/2024-europeenne-candidats.parquet
    cmd: >-
      ${python} hexagonal.elections.candidatures.europeenne2024
      ${raw}/ministere_interieur/2024-europeenne-candidats.csv
      ${clean}/elections/2024-europeenne-candidats.parquet

  2022-legislatives-candidats:
    foreach:
      - 1
      - 2
    do:
      cmd: >-
        ${python} hexagonal.elections.candidatures.qualifier_legislatives2022
        ${clean}/elections/2022-legislatives-${item}-candidats.csv
        ${raw}/le_monde/2022-legislatives-nuances.csv
        ${raw}/legis_2022/2022-legislatives-nuances.csv
        ${main}/elections/2022-legislatives-${item}-candidats.csv
      deps:
        - ${clean}/elections/2022-legislatives-${item}-candidats.csv
        - ${clean}/elections/2022-legislatives-1-circonscription.parquet
        - ${clean}/elections/2022-legislatives-2-circonscription.parquet
        - ${raw}/le_monde/2022-legislatives-nuances.csv
        - ${raw}/legis_2022/2022-legislatives-nuances.csv
        - ${src}/hexagonal/elections/candidatures/qualifier_legislatives2022.py
        - ${src}/hexagonal/codes.py
      outs:
        - ${main}/elections/2022-legislatives-${item}-candidats.csv

  2021-regionales-candidats:
    deps:
      - ${raw}/ministere_interieur/2021-regionales-1-candidats.csv
      - ${src}/hexagonal/elections/candidatures/regionales2021.py
    outs:
      - ${clean}/elections/2021-regionales-1-candidats.parquet
    cmd: >-
      ${python} hexagonal.elections.candidatures.regionales2021
      ${raw}/ministere_interieur/2021-regionales-1-candidats.csv
      ${clean}/elections/2021-regionales-1-candidats.parquet

  parrainages_identifier:
    deps:
      - ${main}/elections/2022-presidentielle-parrainages.csv
      - ${clean}/rne/conseillers_municipaux.csv
      - ${main}/cog/communes.csv
      - ${clean}/cog/communes_com.csv
      - ${src}/hexagonal/parrainages/identifier.py
    outs:
      - ${main}/elections/2022-presidentielle-parrains-en-poste.csv
    cmd: >-
      ${python} hexagonal.parrainages.identifier
      ${main}/elections/2022-presidentielle-parrainages.csv
      ${clean}/rne/conseillers_municipaux.csv
      ${main}/cog/communes.csv
      ${clean}/cog/communes_com.csv
      ${main}/elections/2022-presidentielle-parrains-en-poste.csv

  parrainages_nettoyer:
    foreach:
      - 2022
    do:
      deps:
        - ${raw}/conseil_constitutionnel/${item}-presidentielle-parrainages.csv
        - ${src}/hexagonal/parrainages/nettoyer.py
      outs:
        - ${clean}/elections/${item}-presidentielle-parrainages.csv
      cmd: >-
        ${python} hexagonal.parrainages.nettoyer
        ${raw}/conseil_constitutionnel/${item}-presidentielle-parrainages.csv
        ${clean}/elections/${item}-presidentielle-parrainages.csv

  parrainages_qualifier:
    foreach:
      - 2022
    do:
      deps:
        - ${clean}/elections/${item}-presidentielle-parrainages.csv
        - ${clean}/cog/departements.csv
        - ${clean}/cog/communes.csv
        - ${clean}/cog/communes_com.csv
        - ${src}/hexagonal/parrainages/qualifier.py
      outs:
        - ${main}/elections/${item}-presidentielle-parrainages.csv
      cmd: >-
        ${python} hexagonal.parrainages.qualifier
        ${clean}/elections/${item}-presidentielle-parrainages.csv
        ${clean}/cog/
        ${main}/elections/${item}-presidentielle-parrainages.csv

  ajouter_circonscription:
    foreach:
      - 2024-legislatives-1-bureau_de_vote
      - 2024-legislatives-2-bureau_de_vote
    do:
      deps:
        - ${clean}/elections/${item}.parquet
        - ${clean}/elections/2024-legislatives-correspondances-bureau_de_vote-circonscription.csv
        - ${src}/hexagonal/elections/legislatives/ajouter_circonscription.py
      outs:
        - ${main}/elections/${item}.parquet
      cmd: >-
        ${python} hexagonal.elections.legislatives.ajouter_circonscription
        --resultats ${clean}/elections/${item}.parquet
        --correspondance ${clean}/elections/2024-legislatives-correspondances-bureau_de_vote-circonscription.csv
        --output ${main}/elections/${item}.parquet

  correspondances_bureau_de_vote_circonscription:
    foreach:
      - 2024
    do:
      cmd: >-
        ${python} hexagonal.elections.legislatives.correspondances_circonscription
        ${clean}/elections/${item}-legislatives-1-bureau_de_vote.parquet
        ${clean}/elections/${item}-legislatives-1-candidats.csv
        ${clean}/elections/${item}-legislatives-correspondances-bureau_de_vote-circonscription.csv
      deps:
        - ${clean}/elections/${item}-legislatives-1-bureau_de_vote.parquet
        - ${clean}/elections/${item}-legislatives-1-candidats.csv
        - ${src}/hexagonal/elections/legislatives/correspondances_circonscription.py
        - ${src}/hexagonal/codes.py
      outs:
        - ${clean}/elections/${item}-legislatives-correspondances-bureau_de_vote-circonscription.csv

  assemblee_nationale_fiches:
    deps:
      - ${raw}/assemblee-nationale.zip
      - ${src}/hexagonal/assemblee_nationale/fiches.py
      - ${src}/hexagonal/assemblee_nationale/utils.py
    outs:
      - ${clean}/assemblee_nationale/fiches.csv
      - ${clean}/assemblee_nationale/adresses_postales.csv
      - ${clean}/assemblee_nationale/adresses_electroniques.csv
    cmd: >-
      ${python} hexagonal.assemblee_nationale.fiches
      ${raw}/assemblee-nationale.zip
      ${clean}/assemblee_nationale/fiches.csv
      ${clean}/assemblee_nationale/adresses_postales.csv
      ${clean}/assemblee_nationale/adresses_electroniques.csv

  assemblee_nationale_mandats:
    deps:
      - ${raw}/assemblee-nationale.zip
      - ${src}/hexagonal/assemblee_nationale/mandats.py
      - ${src}/hexagonal/assemblee_nationale/utils.py
    outs:
      - ${clean}/assemblee_nationale/mandats.csv
    cmd: >-
      ${python} hexagonal.assemblee_nationale.mandats
      ${raw}/assemblee-nationale.zip
      ${clean}/assemblee_nationale/mandats.csv

  assemblee_nationale_groupes:
    deps:
      - ${raw}/assemblee-nationale.zip
      - ${src}/hexagonal/assemblee_nationale/groupes.py
      - ${src}/hexagonal/assemblee_nationale/utils.py
    outs:
      - ${clean}/assemblee_nationale/groupes.csv
      - ${clean}/assemblee_nationale/affiliations.csv
    cmd: >-
      ${python} hexagonal.assemblee_nationale.groupes
      ${raw}/assemblee-nationale.zip
      ${clean}/assemblee_nationale/groupes.csv
      ${clean}/assemblee_nationale/affiliations.csv

  assemblee_nationale_commissions:
    deps:
      - ${raw}/assemblee-nationale.zip
      - ${src}/hexagonal/assemblee_nationale/commissions.py
      - ${src}/hexagonal/assemblee_nationale/utils.py
    outs:
      - ${clean}/assemblee_nationale/commissions.csv
    cmd: >-
      ${python} hexagonal.assemblee_nationale.commissions
      ${raw}/assemblee-nationale.zip
      ${clean}/assemblee_nationale/commissions.csv

  assemblee_nationale_deputes:
    deps:
      - ${src}/hexagonal/assemblee_nationale/deputes.py
      - ${clean}/assemblee_nationale/fiches.csv
      - ${clean}/assemblee_nationale/adresses_electroniques.csv
      - ${clean}/assemblee_nationale/commissions.csv
      - ${clean}/assemblee_nationale/mandats.csv
      - ${clean}/assemblee_nationale/affiliations.csv
    outs:
      - ${main}/assemblee_nationale/deputes.csv
      - ${main}/assemblee_nationale/deputes_lfi.csv
    cmd:
      ${python} hexagonal.assemblee_nationale.deputes
      ${clean}/assemblee_nationale
      ${main}/assemblee_nationale

  rne_nettoyer:
    foreach:
      - conseillers_arrondissement
      - conseillers_municipaux
      - conseillers_departementaux
      - conseillers_regionaux
      - conseillers_csp
    do:
      deps:
        - ${raw}/rne/${rne}/${item}.csv
        - ${src}/hexagonal/rne/extraire.py
      outs:
        - ${clean}/rne/${item}.csv
      cmd: >-
        ${python} hexagonal.rne.extraire
        ${raw}/rne/${rne}
        ${clean}/rne
        ${item}

  annuaire_extraire:
    deps:
      - ${raw}/annuaire/annuaire.tar.bz2
      - ${src}/hexagonal/annuaire/extraire_organismes.py
    outs:
      - ${raw}/annuaire/mairies.json
      - ${raw}/annuaire/epcis.json
      - ${raw}/annuaire/conseils_departementaux.json
      - ${raw}/annuaire/conseils_regionaux.json
      - ${raw}/annuaire/prefectures.json
    cmd: >-
      ${python} hexagonal.annuaire.extraire_organismes
      ${raw}/annuaire/annuaire.tar.bz2
      ${raw}/annuaire/

  annuaires_nettoyer:
    deps:
      - ${raw}/annuaire/mairies.json
      - ${raw}/annuaire/conseils_departementaux.json
      - ${src}/hexagonal/annuaire/nettoyer.py
    outs:
      - ${clean}/annuaire/mairies.csv
      - ${clean}/annuaire/conseils_departementaux.csv
      - ${clean}/annuaire/conseils_regionaux.csv
      - ${clean}/annuaire/prefectures.csv
    cmd: >-
      ${python} hexagonal.annuaire.nettoyer
      ${raw}/annuaire
      ${clean}/annuaire

  cog_nettoyer:
    deps:
      - ${raw}/insee/cog.zip
      - ${src}/hexagonal/cog/extraire.py
    outs:
      - ${clean}/cog/regions.csv
      - ${clean}/cog/departements.csv
      - ${clean}/cog/arrondissements.csv
      - ${clean}/cog/cantons.csv
      - ${clean}/cog/communes.csv
      - ${clean}/cog/communes_com.csv
      - ${clean}/cog/communes_historiques.csv
      - ${clean}/cog/com.csv
      - ${clean}/cog/ctcd.csv
      - ${clean}/cog/mouvements_communes.csv
    cmd: >-
      ${python} hexagonal.cog.extraire
      ${raw}/insee/cog.zip
      ${clean}/cog

  epci_nettoyer:
    deps:
      - ${raw}/ministere_interieur/banatic.xlsx
      - ${raw}/insee/epci_fp.zip
      - ${src}/hexagonal/intercommunalite/nettoyer.py
    outs:
      - ${clean}/epci.csv
      - ${clean}/communes_epci.csv
    cmd: >-
      ${python} hexagonal.intercommunalite.nettoyer
      --banatic ${raw}/ministere_interieur/banatic.xlsx
      --insee ${raw}/insee/epci_fp.zip
      --epci ${clean}/epci.csv
      --composition ${clean}/communes_epci.csv

  admin_express_extraire:
    deps:
      - ${raw}/ign/admin_express/admin_express_cog.7z
      - ${src}/hexagonal/admin_express/extraire.py
    outs:
      - ${raw}/ign/admin_express/communes.cpg
      - ${raw}/ign/admin_express/communes.dbf
      - ${raw}/ign/admin_express/communes.prj
      - ${raw}/ign/admin_express/communes.shp
      - ${raw}/ign/admin_express/communes.shx
      - ${raw}/ign/admin_express/communes_deleguees.cpg
      - ${raw}/ign/admin_express/communes_deleguees.dbf
      - ${raw}/ign/admin_express/communes_deleguees.prj
      - ${raw}/ign/admin_express/communes_deleguees.shp
      - ${raw}/ign/admin_express/communes_deleguees.shx
      - ${raw}/ign/admin_express/arrondissements_municipaux.cpg
      - ${raw}/ign/admin_express/arrondissements_municipaux.dbf
      - ${raw}/ign/admin_express/arrondissements_municipaux.prj
      - ${raw}/ign/admin_express/arrondissements_municipaux.shp
      - ${raw}/ign/admin_express/arrondissements_municipaux.shx
    cmd: >-
      ${python} hexagonal.admin_express.extraire
      ${raw}/ign/admin_express/admin_express_cog.7z
      ${raw}/ign/admin_express/

  nettoyer_population_reference:
    foreach:
      - 2023
    do:
      deps:
        - ${raw}/insee/census/${item}/population-reference.zip
        - ${clean}/cog/communes.csv
        - ${src}/hexagonal/population/nettoyer_population_reference.py
      outs:
        - ${clean}/population/${item}-population-reference.parquet
      cmd:
        ${python} hexagonal.population.nettoyer_population_reference
        --archive ${raw}/insee/census/${item}/population-reference.zip
        --cog-communes ${clean}/cog/communes.csv
        --output ${clean}/population/${item}-population-reference.parquet

  nettoyer_historique_population:
    deps:
      - ${raw}/insee/population_municipale.xlsx
      - ${src}/hexagonal/population/nettoyer_historique.py
    outs:
      - ${clean}/population/historique.csv
    cmd: >-
      ${python} hexagonal.population.nettoyer_historique
      ${raw}/insee/population_municipale.xlsx
      ${clean}/population/historique.csv

  qualifier_communes:
    deps:
      - ${clean}/cog/communes.csv
      - ${clean}/population/2023-population-reference.parquet
      - ${clean}/epci.csv
      - ${clean}/communes_epci.csv
      - ${src}/hexagonal/cog/qualifier_communes.py
    outs:
      - ${main}/cog/communes.csv
    cmd: >-
      ${python} hexagonal.cog.qualifier_communes
      ${clean}/cog/communes.csv
      ${clean}/population/2023-population-reference.parquet
      ${clean}/epci.csv
      ${clean}/communes_epci.csv
      ${main}/cog/communes.csv

  communes_details:
    deps:
      - ${src}/scripts/geodata/communes.sh
      - ${raw}/ign/admin_express/communes.cpg
      - ${raw}/ign/admin_express/communes.dbf
      - ${raw}/ign/admin_express/communes.prj
      - ${raw}/ign/admin_express/communes.shp
      - ${raw}/ign/admin_express/communes.shx
    outs:
      - ${main}/geodata/communes.json
    cmd: >-
      ${src}/scripts/geodata/communes.sh
      ${raw}/ign/admin_express/communes.shp
      ${main}/geodata/communes.json

  circonscriptions_details:
    deps:
      - ${raw}/insee/insee_circonscriptions_legislatives.zip
      - ${src}/scripts/geodata/circonscriptions.sh
    outs:
      - ${main}/geodata/circonscriptions_legislatives.json
    cmd: >-
      ${src}/scripts/geodata/circonscriptions.sh
      ${raw}/insee/insee_circonscriptions_legislatives.zip
      ${main}/geodata/circonscriptions_legislatives.json

  communes_carto:
    foreach: ${zones_carto}
    do:
      deps:
        - ${src}/scripts/cartographie/filter_project.sh
        - ${main}/geodata/communes.json
      outs:
        - ${main}/cartographie/communes_${key}.json
      cmd: >-
        ${src}/scripts/cartographie/filter_project.sh
        ${main}/geodata/communes.json
        ${main}/cartographie/communes_${key}.json
        ${key}
        '${item.filtre}'
        ${item.projection}

  circonscriptions_carto:
    foreach: ${zones_carto}
    do:
      deps:
        - ${src}/scripts/cartographie/filter_project.sh
        - ${main}/geodata/circonscriptions_legislatives.json
      outs:
        - ${main}/cartographie/circonscriptions_${key}.json
      cmd: >-
        ${src}/scripts/cartographie/filter_project.sh
        ${main}/geodata/circonscriptions_legislatives.json
        ${main}/cartographie/circonscriptions_${key}.json
        ${key}
        '${item.filtre}'
        ${item.projection}

  paris_carto:
    deps:
      - ${raw}/paris/2022-secteur-bureaux.json
      - ${raw}/paris/2024-secteur-bureaux.json
    outs:
      - ${main}/cartographie/paris-2022-2024.json
    cmd: >-
      mapshaper
      -i ${raw}/paris/2022-secteur-bureaux.json ${raw}/paris/2024-secteur-bureaux.json combine-files
      -proj EPSG:3857 'target=*'
      -clean snap-interval=10m 'target=*'
      -rename-layers 2022,2024 target=2022-secteur-bureaux,2024-secteur-bureaux
      -o ${main}/cartographie/paris-2022-2024.json format=topojson 'target=*'

  extraire_geonames_cities1000:
    deps:
      - ${raw}/geonames/cities1000.zip
      - ${src}/hexagonal/geonames/extract.py
    outs:
      - ${clean}/geonames/cities1000.json.zst
    cmd: ${python} hexagonal.geonames.extract ${raw}/geonames/cities1000.zip ${clean}/geonames/cities1000.json.zst

  pays_carto:
    deps:
      - ${src}/scripts/cartographie/pays.sh
      - ${raw}/natural_earth/ne_10m_admin_0_countries.zip
      - ${clean}/geonames/cities1000.json.zst
    outs:
      - ${main}/cartographie/pays.json.zst
    cmd: >-
      ${src}/scripts/cartographie/pays.sh
      ${raw}/natural_earth/ne_10m_admin_0_countries.zip
      ${clean}/geonames/cities1000.json.zst
      ${main}/cartographie/pays.json.zst

  extraire_codes_postaux:
    deps:
      - ${raw}/la_poste/base_officielle_codes_postaux.csv
      - ${src}/hexagonal/codes_postaux/extraire.py
    outs:
      - ${clean}/codes_postaux.csv
    cmd: >-
      ${python} hexagonal.codes_postaux.extraire
      ${raw}/la_poste/base_officielle_codes_postaux.csv
      ${clean}/codes_postaux.csv

  qualifier_codes_postaux:
    deps:
      - ${clean}/codes_postaux.csv
      - ${main}/cog/communes.csv
      - ${src}/hexagonal/codes_postaux/qualifier.py
    outs:
      - ${main}/codes_postaux.csv
    cmd: >-
      ${python} hexagonal.codes_postaux.qualifier
      ${clean}/codes_postaux.csv
      ${main}/cog/communes.csv
      ${main}/codes_postaux.csv

  extraire_contours_iris:
    deps:
      - ${raw}/ign/iris-metropole.7z
    outs:
      - ${raw}/ign/iris-metropole.gpkg
    cmd: >-
      7z e ${raw}/ign/iris-metropole.7z -so -r "iris.gpkg" > "${raw}/ign/iris-metropole.gpkg"

  extraire_filosofi_disponible:
    deps:
      - ${raw}/insee/filosofi-disponible.zip
      - ${src}/hexagonal/filosofi/extraire.py
    outs:
      - ${clean}/filosofi/disponible.csv
    cmd: >-
      ${python} hexagonal.filosofi.extraire
      ${raw}/insee/filosofi-disponible.zip
      ${clean}/filosofi/disponible.csv

  nb-conseillers-municipaux:
    deps:
      - ${clean}/population/historique.csv
      - ${raw}/lafranceinsoumise/code_electoral/2014-nb-conseillers-municipaux.csv
      - ${raw}/lafranceinsoumise/code_electoral/2026-conseillers-plm.csv
      - ${raw}/lafranceinsoumise/code_electoral/pre-2026-conseillers-municipaux-plm.csv
      - ${src}/hexagonal/elections/nombre_conseillers_municipaux.py
    outs:
      - ${main}/elections/nombre_conseillers_municipaux.parquet
    cmd: >-
      ${python} hexagonal.elections.nombre_conseillers_municipaux
      --population ${clean}/population/historique.csv
      --nb-conseillers ${raw}/lafranceinsoumise/code_electoral/2014-nb-conseillers-municipaux.csv
      --plm-2026 ${raw}/lafranceinsoumise/code_electoral/2026-conseillers-plm.csv
      --plm-pre-2026 ${raw}/lafranceinsoumise/code_electoral/pre-2026-conseillers-municipaux-plm.csv
      --output ${main}/elections/nombre_conseillers_municipaux.parquet
